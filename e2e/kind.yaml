# kind cluster used by `make e2e`.
#
# The host ports are mapped to the control plane node. The defaults are
# unprivileged so that rootless podman works without changing
# net.ipv4.ip_unprivileged_port_start. Use E2E_HTTP_PORT / E2E_HTTPS_PORT to
# change them (run.sh then generates a temporary copy of this file); 80/443
# require lowering the sysctl, see e2e/README.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: katenary-e2e
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 9080
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
