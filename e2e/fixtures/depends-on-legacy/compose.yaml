name: e2e-depends-on-legacy

services:
  db:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - sleep 10; exec redis-server
    ports:
      - "6379:6379"

  web:
    image: nginx:1.29
    ports:
      - "80:80"
    depends_on:
      - db
    labels:
      katenary.v4/depends-on: legacy
