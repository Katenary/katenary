name: e2e-networkpolicy

services:
  db:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    labels:
      katenary.v4/network-policy: |-
        enabled: true

  web:
    image: busybox:1.38.0
    command:
      - sh
      - -c
      - sleep 3600
    depends_on:
      - db
    labels:
      katenary.v4/network-policy: |-
        enabled: true
