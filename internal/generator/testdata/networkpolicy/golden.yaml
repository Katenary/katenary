# Source: networkpolicy/templates/web/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    katenary.io/compose-hash: f89a31b1e299ddd1e0d2036428c549b3c5350719
    katenary.io/version: master
  labels:
    app.kubernetes.io/name: networkpolicy
    app.kubernetes.io/instance: release-name
    helm.sh/chart: networkpolicy-0.1.0
    app.kubernetes.io/version: '0.1.0'
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: web
  name: 'release-name-networkpolicy-web'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: networkpolicy
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: web
  strategy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: networkpolicy
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: web
    spec:
      containers:
      - image: 'nginx:1.29'
        imagePullPolicy: IfNotPresent
        name: web
        ports:
        - containerPort: 80
          name: http
        securityContext:
          allowPrivilegeEscalation: false
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |-
          NAMESPACE=${NAMESPACE:-default}
          DEPLOYMENT_NAME=release-name-networkpolicy-database
          KUBERNETES_SERVICE_HOST=${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}
          KUBERNETES_SERVICE_PORT=${KUBERNETES_SERVICE_PORT:-443}

          until curl -s -o- --header="Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            --cacert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/apis/apps/v1/namespaces/${NAMESPACE}/deployments/${DEPLOYMENT_NAME}" \
            | grep -q '"readyReplicas":[[:space:]]*[1-9][0-9]*'; do
            sleep 2
          done
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/curl/curl:8.23.0
        name: wait-for-database
      serviceAccountName: 'release-name-networkpolicy-web-dependency'

